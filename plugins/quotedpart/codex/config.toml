# QuotedPart MCP server for Codex without the plugin. Paste into ~/.codex/config.toml
# (or a trusted project's .codex/config.toml), or run:
#   codex mcp add quotedpart --url https://mcp.quotedpart.com/mcp

[mcp_servers.quotedpart]
url = "https://mcp.quotedpart.com/mcp"
startup_timeout_sec = 20
# A drawing read can take up to wait_seconds (default 90) inside estimate_price.
tool_timeout_sec = 150
